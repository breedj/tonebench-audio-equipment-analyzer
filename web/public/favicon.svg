<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- QA403 Audio Analyzer app icon: a dark tile carrying a sine wave over a spectrum's bars.
       Source of packaging/windows/qa403.ico, packaging/linux/qa403-audio-analyzer.png and
       web/public/favicon.svg; regenerate all three with `npm run icons` in web/. Kept to large
       shapes so the 16 px taskbar rendering still reads as a waveform. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <!-- spectrum bars: fundamental and falling harmonics -->
  <g fill="#38bdf8" opacity="0.55">
    <rect x="44" y="150" width="18" height="62" rx="4"/>
    <rect x="76" y="118" width="18" height="94" rx="4"/>
    <rect x="108" y="164" width="18" height="48" rx="4"/>
    <rect x="140" y="178" width="18" height="34" rx="4"/>
    <rect x="172" y="188" width="18" height="24" rx="4"/>
    <rect x="204" y="196" width="18" height="16" rx="4"/>
  </g>
  <!-- one period of a sine wave -->
  <path d="M40 96 C 62 40, 84 40, 106 96 S 150 152, 172 96 S 208 40, 220 96"
        fill="none" stroke="#4ade80" stroke-width="16" stroke-linecap="round"/>
</svg>
