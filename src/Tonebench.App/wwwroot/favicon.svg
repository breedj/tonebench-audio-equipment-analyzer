<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Tonebench - Audio Equipment Analyzer app icon: four rounded bars — a level meter, or four
       tones at four levels — on a dark tile. Joost's own drawing, supplied as
       docs/design/tonebench-icon.svg on 2026-10-12, replacing the harmonic comb that had stood
       since 2026-09-30; it is simpler at 16 px, which is the only size the taskbar and the favicon
       ever get.

       Source of packaging/windows/tonebench.ico, packaging/linux/tonebench.png and
       web/public/favicon.svg; regenerate all three with `npm run icons` in web/.

       TWO THINGS HERE ARE LOAD-BEARING.

       (1) The tile is not decoration. `web/src/components/TonebenchLogo.vue` draws the same four
       bars as a bare glyph for use inside the app, where there is a panel behind them; an icon has
       no known background. So the shipped icon carries its own ground, and its own lighter weights
       — #60a5fa/#a78bfa/#f472b6/#fb923c, which read against a dark tile, rather than the
       #3b82f6/#8b5cf6/#ec4899/#f97316 the in-app glyph uses against a panel.

       (2) The geometry below is the supplied SVG's own 24-unit coordinates, placed by one transform
       rather than re-drawn at tile scale. Their bounds are x 3..21 and y 5..21 (the nominal rects —
       the corners are radii, not strokes, so nothing sticks out), fitted to x 36..220, the same
       184-wide window the comb used, and centred vertically: scale 184/18 = 10.2222, hence the
       translate. TonebenchLogo.vue applies the same transform for its own tile variant, so the two
       cannot drift apart — edit the numbers in both, or in neither. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>

  <g transform="translate(5.333 -4.91) scale(10.2222)">
    <rect x="3" y="12" width="3" height="9" rx="1.5" fill="#60a5fa"/>
    <rect x="8" y="5" width="3" height="16" rx="1.5" fill="#a78bfa"/>
    <rect x="13" y="9" width="3" height="12" rx="1.5" fill="#f472b6"/>
    <rect x="18" y="15" width="3" height="6" rx="1.5" fill="#fb923c"/>
  </g>
</svg>
