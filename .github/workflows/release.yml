name: Build, test, and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Three categories, and the gate subtracts two of them. Category=Hardware needs a real QA403 or
      # QA451 on a bench; Category=VirtualDevice needs virtual-qa40x-rs attached over USB/IP (see
      # testbench/virtual-qa40x/README.md). CI has neither. Everything else runs here, matching
      # CLAUDE.md's documented pre-commit command — a test carrying no Category trait satisfies both
      # !=, which is what keeps the untraited bulk of the suite in this run.
      - run: dotnet test Tonebench.sln --filter "Category!=Hardware&Category!=VirtualDevice" --configuration Release

  # The first Mac ever to run this code. macOS is Apple Silicon, runs-from-source only, and nobody
  # on the project owns one — MACOS-TESTING.md exists to hand that to a volunteer. A GitHub standard
  # macOS runner is free and unlimited on a public repository, so stages 1 to 3 of that manual can
  # be answered here instead of waiting for a person. What is still only a person's to do: Core
  # Audio, a QA403 on USB, and the terminal-close shutdown.
  #
  # Standalone and continue-on-error, both deliberately. `build` has `needs: test`, so putting this
  # in that job would let an untried platform stop the win-x64 and linux-x64 packages being
  # produced. Being outside the chain it cannot, and continue-on-error means a red leg reports green
  # — so read the log, not the badge, until that is flipped off.
  macos:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is the arm64 M1 image, which is the supported platform. macos-15-intel is
        # informational: it tests the standing hypothesis that Intel from source already works
        # (run.sh's Homebrew branch is [ -d ]-guarded so it no-ops there, and both library resolvers
        # find their leaf names through dyld's default /usr/local/lib, which is Intel Homebrew's own
        # prefix — see PortAudioInterop.cs). Green here means the build and the suite pass, NOT that
        # Intel is supported: Core Audio and USB are untested there as everywhere else on macOS.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Neither is touched by a --simulate run (PortAudio is only initialised by
      # GET /api/soundcard/devices), so this is here to prove MACOS-TESTING.md's stage 0 line works
      # on a clean machine, and so that a step which does touch them later needs no edit.
      - name: Install the native libraries the manual asks for
        run: brew install libusb portaudio

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - run: dotnet test Tonebench.sln --filter "Category!=Hardware&Category!=VirtualDevice" --configuration Release

      # Deliberately `dotnet build` and the framework-dependent binary, i.e. exactly what run.sh
      # does — NOT `dotnet publish -r osx-arm64`. The publish property group sets
      # EnableCompressionInSingleFile, which is unsupported for osx-*; publishing here would start a
      # packaging project rather than test the only macOS story that exists. This covers stages 2
      # and 3 of the manual: the app starts, serves, and QuestPDF's libQuestPdfSkia.dylib loads and
      # renders — the second being the thing only a running binary can prove.
      - name: Smoke test (--simulate)
        run: |
          dotnet build src/Tonebench.App/Tonebench.App.csproj -c Release --nologo
          cd src/Tonebench.App/bin/Release/net10.0
          ./Tonebench.App --simulate --no-browser &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8399/api/update-check >/dev/null 2>&1; then
              echo "App responded."
              HEAD=$(curl -fs -H 'Content-Type: application/json' \
                -d '{"title":"smoke","subtitle":null,"generated":"now","notes":null,"chapters":[]}' \
                http://127.0.0.1:8399/api/reports/pdf | head -c 5)
              kill $PID
              if [ "$HEAD" = "%PDF-" ]; then
                echo "PDF rendered, smoke test passed."
                exit 0
              fi
              echo "PDF endpoint did not return a PDF (got '$HEAD')" >&2
              exit 1
            fi
            sleep 1
          done
          echo "App did not respond within 30s" >&2
          kill $PID || true
          exit 1

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # Release tags (vX.Y.Z) set the published assembly version to match the tag exactly, so the
      # update-check feature compares like against like. Non-tag builds carry Directory.Build.props'
      # dev default, read through MSBuild so it is never duplicated here — the packages need a
      # version in their file names either way.
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(dotnet msbuild src/Tonebench.App/Tonebench.App.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      # The single-file/trimmed/self-contained shape lives in Tonebench.App.csproj under its publish
      # condition, so this is the same one-liner packaging/windows/build.ps1, packaging/linux/build.sh
      # and README.md use.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Tonebench.App/Tonebench.App.csproj -c Release -r ${{ matrix.rid }} \
            -p:Version=${{ steps.version.outputs.version }} -o publish/${{ matrix.rid }}

      # Verifies the trimmed self-contained binary actually runs, not just that it built — trimming
      # is the likeliest way to silently break Dapper's reflection-based mapping (see
      # Tonebench.App.csproj's TrimmerRootAssembly note). The PDF render is the second thing only a
      # published binary can prove: QuestPDF's native Skia library has to be found after the
      # single-file self-extract, and on Linux it has to link against the runner's libfontconfig.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: publish/${{ matrix.rid }}
        run: |
          chmod +x Tonebench.App
          ./Tonebench.App --simulate --no-browser &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8399/api/update-check >/dev/null 2>&1; then
              echo "App responded."
              HEAD=$(curl -fs -H 'Content-Type: application/json' \
                -d '{"title":"smoke","subtitle":null,"generated":"now","notes":null,"chapters":[]}' \
                http://127.0.0.1:8399/api/reports/pdf | head -c 5)
              kill $PID
              if [ "$HEAD" = "%PDF-" ]; then
                echo "PDF rendered, smoke test passed."
                exit 0
              fi
              echo "PDF endpoint did not return a PDF (got '$HEAD')" >&2
              exit 1
            fi
            sleep 1
          done
          echo "App did not respond within 20s" >&2
          kill $PID || true
          exit 1

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: publish/${{ matrix.rid }}
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\Tonebench.App.exe -ArgumentList "--simulate --no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8399/api/update-check -TimeoutSec 2 | Out-Null
              $ok = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          $pdfOk = $false
          if ($ok) {
            try {
              $body = '{"title":"smoke","subtitle":null,"generated":"now","notes":null,"chapters":[]}'
              $response = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType 'application/json' -Body $body `
                -Uri http://127.0.0.1:8399/api/reports/pdf -TimeoutSec 30
              $bytes = $response.Content
              $pdfOk = $bytes.Length -gt 5 -and [System.Text.Encoding]::ASCII.GetString($bytes, 0, 5) -eq '%PDF-'
            } catch {
              Write-Host "PDF request failed: $_"
            }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "App did not respond within 20s"
            exit 1
          }
          if (-not $pdfOk) {
            Write-Error "PDF endpoint did not return a PDF"
            exit 1
          }
          Write-Host "App responded and rendered a PDF, smoke test passed."

      # ---- Windows: zip + Inno Setup installer -------------------------------------------------

      # A whitelist, not `*`: the publish folder also holds a loose wwwroot copy (embedded already)
      # and the static-web-assets manifest. libusb-1.0.dll is inside the exe; QuestPDF's font is not.
      - name: Package (zip)
        if: runner.os == 'Windows'
        working-directory: publish/${{ matrix.rid }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          Compress-Archive -Path Tonebench.App.exe, QuestPDF.Fonts.Lato.br, appsettings.json `
            -DestinationPath ../../dist/tonebench-${{ steps.version.outputs.version }}-win-x64.zip -Force

      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 -NoPublish -PublishDir publish/${{ matrix.rid }} `
            -Version ${{ steps.version.outputs.version }}

      # The installed layout is the thing users actually run, and the only place a missing file in
      # the installer's whitelist shows up. It also proves the app writes its logs to the data folder
      # and nothing into its own — the property that makes a per-user install and an uninstall safe.
      - name: Smoke test installed layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Item dist/*-win-x64-setup.exe
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Installer exited with $($p.ExitCode)"; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\Tonebench"
          foreach ($f in "Tonebench.App.exe", "QuestPDF.Fonts.Lato.br", "appsettings.json", "unins000.exe") {
            if (-not (Test-Path "$app\$f")) { Write-Error "Installed layout is missing $f"; exit 1 }
          }
          $proc = Start-Process -FilePath "$app\Tonebench.App.exe" -ArgumentList "--simulate --no-browser" -WorkingDirectory $app -PassThru
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8399/api/update-check -TimeoutSec 2 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Installed app did not respond within 20s"; exit 1 }
          if (-not (Get-ChildItem "$env:LOCALAPPDATA\Tonebench\logs\tonebench-*.log" -ErrorAction SilentlyContinue)) {
            Write-Error "No log file under %LOCALAPPDATA%\Tonebench\logs"; exit 1
          }
          if (Test-Path "$app\logs") { Write-Error "The installed app wrote a logs folder beside the exe"; exit 1 }
          $u = Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Error "Uninstaller exited with $($u.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 2
          if (Test-Path $app) { Write-Error "Uninstall left $app behind"; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\Tonebench")) { Write-Error "Uninstall removed the user's data folder"; exit 1 }
          Write-Host "Installed, ran, uninstalled; user data kept."

      # ---- Linux: .deb + tar.gz ----------------------------------------------------------------

      - name: Build packages
        if: runner.os == 'Linux'
        run: |
          ./packaging/linux/build.sh --no-publish --publish-dir publish/${{ matrix.rid }} \
            --version ${{ steps.version.outputs.version }}
          # Depends in packaging/linux/deb/control is hand-maintained; this is the cross-check.
          ldd publish/${{ matrix.rid }}/Tonebench.App || true
          if command -v lintian >/dev/null 2>&1; then lintian dist/*.deb || true; fi

      # apt (with the ./ prefix) resolves Depends and runs postinst, which a bare dpkg -i would not.
      # The run through /usr/bin proves the symlink, the udev rule's placement, the log location and
      # that `apt remove` takes the rule with it and leaves the user's data alone.
      - name: Smoke test installed layout (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/tonebench_*_amd64.deb
          test -f /usr/lib/udev/rules.d/99-qa403.rules
          test -f /usr/share/applications/tonebench.desktop
          test -L /usr/bin/tonebench
          tonebench --simulate --no-browser &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8399/api/update-check >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          # SIGTERM rather than SIGINT: a background job of a non-interactive shell inherits SIGINT
          # ignored, and the runtime honours that. The host treats both as a graceful stop.
          kill -TERM $PID || true
          wait $PID || true
          [ "$ok" = 1 ] || { echo "Installed app did not respond within 20s" >&2; exit 1; }
          ls "$HOME/.local/share/Tonebench/logs"/tonebench-*.log
          grep -q "Host stopped cleanly" "$HOME/.local/share/Tonebench/logs"/tonebench-*.log
          sudo apt-get remove -y tonebench
          test ! -e /usr/lib/udev/rules.d/99-qa403.rules
          test ! -e /usr/lib/tonebench
          test -d "$HOME/.local/share/Tonebench"
          echo "Installed, ran, shut down cleanly on SIGTERM, removed; user data kept."

      # Tags only, and briefly: the `release` job downloads these minutes later and publishes them
      # as release assets, which cost nothing, while an Actions artifact bills against the 500 MB a
      # private repo gets free. Uploading on every push to every branch put ~100 MB per commit
      # (52 MB Windows + 48 MB Linux, each holding the same single-file exe twice — zip plus
      # installer, .deb plus tar.gz) behind the 90-day default retention, and reached 2.35 GB.
      # The `build` job itself stays on every branch: packaging/linux/build.sh needs dpkg, so CI is
      # the only place it ever runs, and its first failure must not wait for a tag.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tonebench-${{ matrix.rid }}
          retention-days: 7
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.deb
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The binaries are not code-signed, so this file is how a user confirms a download is the one
      # that was built here — INSTALL.md's "Why Windows warns about this download" points at it.
      # The sed strips the artifact subdirectory, so each line names the asset exactly as the
      # release page lists it and `sha256sum -c` works with the file downloaded beside the package.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum \
            tonebench-win-x64/*-setup.exe \
            tonebench-win-x64/*.zip \
            tonebench-linux-x64/*.deb \
            tonebench-linux-x64/*.tar.gz \
            | sed 's#[^ ]*/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --repo, because this job never checks the repository out and gh otherwise reads it from git.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            artifacts/tonebench-win-x64/*-setup.exe \
            artifacts/tonebench-win-x64/*.zip \
            artifacts/tonebench-linux-x64/*.deb \
            artifacts/tonebench-linux-x64/*.tar.gz \
            artifacts/SHA256SUMS.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes
